<!doctype html>
<html><head><link rel="stylesheet" href="../../skills/bimble-design/fonts/fonts.css"><link rel="stylesheet" href="../../ds-vars.css"><meta charset="utf-8"><style>
html,body{margin:0;background:var(--cream)}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--cream)}
svg{position:absolute;left:0;top:0}
.clay{fill:var(--clay)}.pink{fill:var(--pink)}.moss{fill:var(--moss)}.ochre{fill:var(--ochre)}.slate{fill:var(--slate)}.ink{fill:var(--ink)}
.text{position:absolute;left:56px;bottom:40px;max-width:440px}
.name{margin:0;font-family:var(--font-display);font-weight:700;font-size:120px;line-height:.92;color:var(--ink)}
.tag{margin:var(--space-3) 0 0;font-family:var(--font-text);font-size:14px;color:var(--stone)}
</style></head><body>
<div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
blocks: clay disc r=144 (2x space-8 + 32), pink disc r=128, slate disc r=56, moss disc r=40, ochre disc r=24; clay and pink lead because they are the logo.
arrangement: the logo's diagonal, clay high-left and pink low-right bleeding off the bottom-right edge, satellites in series order between them, all right of x=480.
pattern: discs (radius-disc) - "the logo's two circles become the system; round where you touch" - a short row of 12px ink-outlined dots (token dot) at space-6 pitch.
scales: dot 12px, pitch space-6 32px, radius-disc 50%; no squares, since this system keeps squares for drawings.
-->
<circle class="clay" cx="640" cy="96" r="144"></circle>
<circle class="pink" cx="872" cy="272" r="128"></circle>
<circle class="slate" cx="812" cy="64" r="56"></circle>
<circle class="moss" cx="560" cy="248" r="40"></circle>
<circle class="ochre" cx="664" cy="264" r="24"></circle>
<g>
<circle class="ink" cx="728" cy="172" r="7"></circle><circle class="pink" cx="728" cy="172" r="6"></circle>
<circle class="ink" cx="760" cy="172" r="7"></circle><circle class="ochre" cx="760" cy="172" r="6"></circle>
<circle class="ink" cx="792" cy="172" r="7"></circle><circle class="moss" cx="792" cy="172" r="6"></circle>
<circle class="ink" cx="824" cy="172" r="7"></circle><circle class="slate" cx="824" cy="172" r="6"></circle>
<circle class="ink" cx="856" cy="172" r="7"></circle><circle class="clay" cx="856" cy="172" r="6"></circle>
</g>
</svg>
<div class="text">
<h1 class="name">Bimble</h1>
<p class="tag">Two discs, five colours: each colour has one job.</p>
</div>
</div>
<script></script>
</body></html>
