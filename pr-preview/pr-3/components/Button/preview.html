<!-- @dsCard group="Actions" height=96 subtitle="Static rendition" -->
<!doctype html>
<html><head><link rel="stylesheet" href="../../skills/bimble-design/fonts/fonts.css"><link rel="stylesheet" href="../../ds-vars.css"><meta charset="utf-8"><style>
body{margin:0;background:var(--cream);font-family:var(--font-text)}
.row{display:flex;gap:var(--space-2);align-items:center;padding:var(--space-5);flex-wrap:wrap}
button{font:inherit;font-size:14px;color:var(--ink);min-height:var(--target);border-radius:var(--radius-pill);cursor:pointer}
.primary{background:var(--action);border:0;font-weight:600;padding:5px 16px}
.secondary{background:var(--sheet);border:1px solid var(--ink);padding:4px 16px}
.quiet{background:var(--sunk);border:0;padding:5px 14px}
.icon{width:var(--target);height:var(--target);padding:0;border:0;background:var(--sunk);display:flex;align-items:center;justify-content:center}
.disabled{background:var(--sunk);color:var(--stone);border:0;padding:5px 16px;cursor:default}
</style></head><body>
<div class="row">
  <button class="primary">Place slab</button>
  <button class="secondary">Export IFC</button>
  <button class="quiet">Cancel</button>
  <button class="icon" aria-label="Measure"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></svg></button>
  <button class="disabled" disabled>Place slab</button>
</div>
<script></script>
</body></html>
