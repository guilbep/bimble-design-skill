<!-- @dsCard group="Status" height=120 subtitle="Static rendition" -->
<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;background:var(--sheet);font-family:var(--font-text);font-size:14px;color:var(--ink)}
.wrap{padding:var(--space-5);display:flex;flex-direction:column;gap:var(--space-3)}
.row{display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center}
.chip{padding:3px 12px;border-radius:var(--radius-pill)}
.dot{display:inline-block;width:var(--dot);height:var(--dot);border-radius:50%;border:1px solid var(--ink);margin-right:var(--space-2);vertical-align:-1px}
</style></head><body>
<div class="wrap">
  <div class="row">
    <span class="chip" style="background:var(--attention)">Not saved: 2 edits</span>
    <span class="chip" style="background:var(--reference)">Linked: Architecture</span>
    <span class="chip" style="background:var(--success)">Saved</span>
    <span class="chip" style="background:var(--selection)">3 selected</span>
  </div>
  <div class="row" style="gap:var(--space-5)">
    <span><span class="dot" style="background:var(--selection)"></span>1 selected</span>
    <span><span class="dot" style="background:var(--success)"></span>History: in sync</span>
    <span><span class="dot" style="background:var(--attention)"></span>Borrowed</span>
  </div>
</div>
<script></script>
</body></html>
